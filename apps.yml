# Apps published to the public F-Droid repo at https://apps.danielrosehill.com/fdroid/repo
#
# Each entry is a GitHub repo whose releases carry a signed APK. scripts/sync_releases.py
# takes the newest non-draft release that has an APK asset matching `asset` (and whose
# tag starts with `tag_prefix`, if set) and stages it as repo/<package>_<tag>.apk.
#
# Only release-signed APKs belong here. A debug-signed build (CN=Android Debug) is
# signed with whatever ~/.android/debug.keystore the build machine had, so the next
# build from a different runner has a different key and Android refuses the update.
#
# APKs published by hand (no GitHub release) need no entry: upload them straight to
# s3://apps-public/fdroid/repo/ and add metadata/<package>.yml. See README.

apps:
  - repo: danielrosehill/Parlance-Dictation
    package: com.danielrosehill.parlance
    tag_prefix: android-

  - repo: danielrosehill/Family-First-Aid-Android
    package: com.danielrosehill.firstaid

  - repo: danielrosehill/Local-UTC-Widget
    package: com.danielrosehill.localutcwidget

# Removed 2026-11-07: My-Weird-Prompts/MWP-FM-Android (com.myweirdprompts.fm, the TWA). The native
# player com.myweirdprompts.fm.player on https://cdn.myweirdprompts.com/fdroid/repo replaces it.
#
# On hold since 2026-11-07: danielrosehill/Parlance-Keyboard (com.danielrosehill.parlance.keyboard).
# It has never had a release: its one build failed on 2026-10-20.
