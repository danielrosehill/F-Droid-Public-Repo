# fdroidserver config. Secrets come from the environment (set by the workflow from
# GitHub secrets); keystore.p12 is decoded from FDROID_KEYSTORE_B64 at run time and
# is git-ignored.
repo_url: https://apps.bydanielrosehill.com/fdroid/repo
repo_name: Daniel Rosehill Apps
repo_icon: icon.png
repo_description: >-
  Android apps by Daniel Rosehill, built from their public GitHub repositories.
  Includes Hebrish and Parlance on-device dictation.

archive_older: 3
archive_url: https://apps.bydanielrosehill.com/fdroid/archive
archive_name: Daniel Rosehill Apps (archive)
archive_description: Older versions of apps in the Daniel Rosehill Apps repo.

sdk_path: $ANDROID_HOME
keystore: keystore.p12
repo_keyalias: fdroid-public
keystorepass: {env: FDROID_KEYSTORE_PASS}
keypass: {env: FDROID_KEYSTORE_PASS}
keydname: CN=Daniel Rosehill Apps, OU=F-Droid, C=IL
