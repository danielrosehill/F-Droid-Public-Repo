name: Publish F-Droid repo

on:
  schedule:
    - cron: "17 * * * *"   # hourly: picks up new GitHub releases of apps in apps.yml
  push:
    branches: [main]
    paths: [apps.yml, config.yml, icon.png, "metadata/**", "scripts/**", ".github/workflows/publish.yml"]
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild the index even if no new release was found (use after a manual APK upload)
        type: boolean
        default: true
  repository_dispatch:
    types: [publish]

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fdroidserver
        run: pip install --quiet fdroidserver==2.4.5

      - name: Decode repo signing key
        env:
          FDROID_KEYSTORE_B64: ${{ secrets.FDROID_KEYSTORE_B64 }}
        run: echo "$FDROID_KEYSTORE_B64" | base64 -d > keystore.p12

      - name: Build and publish
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          FDROID_KEYSTORE_PASS: ${{ secrets.FDROID_KEYSTORE_PASS }}
          GH_TOKEN: ${{ secrets.RELEASES_READ_TOKEN || github.token }}
          FORCE: ${{ (github.event_name == 'schedule') && '0' || (github.event_name == 'workflow_dispatch' && !inputs.force) && '0' || '1' }}
        run: scripts/build.sh

      - name: Commit skeleton metadata for hand-uploaded APKs
        run: |
          git add metadata
          if ! git diff --cached --quiet; then
            git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
              commit -m "Add skeleton metadata generated by fdroid update"
            git push
          fi
